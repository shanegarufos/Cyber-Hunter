<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta charset="utf-8"><title>Cyber Hunter Character Test</title><style>html,body{margin:0;height:100%;background:#0b1424;color:white;font:15px system-ui;overflow:hidden}#info{position:absolute;top:12px;left:12px;right:12px;pointer-events:none}h2{margin:0 0 6px;color:#69b9ff}#status{color:#d9e7f8}#hint{position:absolute;bottom:16px;left:12px;right:12px;text-align:center;color:#a7c2df;pointer-events:none}canvas{display:block}</style></head><body><div id="info"><h2>Cyber Hunter · Character Test</h2><div id="status">Loading 3D character…</div></div><div id="hint">Drag to rotate · Pinch to zoom</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script><script>window.addEventListener('error',e=>{document.querySelector('#status').textContent='Error: '+e.message});window.addEventListener('unhandledrejection',e=>{document.querySelector('#status').textContent='Error: '+String(e.reason)});</script><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
document.querySelector('#status').textContent='3D engine started · Loading character…';const scene=new THREE.Scene();scene.background=new THREE.Color('#0b1424');
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,1000);camera.position.set(2,1.6,3.5);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8edff,0x283348,2.3));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(3,6,4);scene.add(light);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const grid=new THREE.GridHelper(8,16,0x2e6ba5,0x23405e);scene.add(grid);
new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('./Military_Male_02-custom.glb',g=>{const obj=g.scene;scene.add(obj);obj.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(obj);const size=bounds.getSize(new THREE.Vector3());const center=bounds.getCenter(new THREE.Vector3());obj.position.sub(center);obj.position.y+=size.y/2;grid.position.y=0;const largest=Math.max(size.x,size.y,size.z);camera.position.set(largest*1.2,largest*.85,largest*2);controls.target.set(0,size.y*.5,0);camera.near=Math.max(.001,largest/1000);camera.far=Math.max(100,largest*100);camera.updateProjectionMatrix();controls.update();document.querySelector('#status').textContent='Model loaded ✓ · Touch and rotate to inspect';},undefined,e=>{document.querySelector('#status').textContent='Model failed: '+(e.message||String(e));console.error(e)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
