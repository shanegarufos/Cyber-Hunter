<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cyber Hunter v0.08.2 Movement Calibration</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1424;color:#e9f3ff;font-family:system-ui}canvas{display:block;touch-action:none}#top{position:absolute;top:env(safe-area-inset-top,12px);left:12px;right:12px;pointer-events:none}h3{margin:8px 0 4px;color:#78baff}#status{font-size:13px}#ui{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:10px;right:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{background:#1a3554;color:white;border:1px solid #5686b8;border-radius:14px;padding:12px 17px;font-size:16px;font-weight:650}button.active{background:#2676ba}#reportbox{position:absolute;top:125px;left:12px;right:12px;z-index:2}#reportbox button{padding:8px;font-size:12px}#report{display:none;max-height:29vh;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#142640;border:1px solid #5686b8;border-radius:8px;padding:10px;font-size:11px}#report.open{display:block}#calibrate{position:absolute;top:72px;left:12px;right:12px;z-index:3;display:flex;gap:5px;align-items:center;flex-wrap:wrap}#calibrate select,#calibrate button{font-size:12px;padding:7px;border-radius:8px;background:#1a3554;color:white;border:1px solid #5686b8}#calibrate button.active{background:#2676ba}#tip{position:absolute;bottom:105px;left:8px;right:8px;text-align:center;color:#9bb7d5;font-size:12px;pointer-events:none}</style></head><body><div id="top"><h3>Cyber Hunter · Movement Calibration v0.08.3</h3><div id="status">Loading soldier…</div></div><div id="calibrate"><select id="joint"><option value="lt">Left thigh</option><option value="rt">Right thigh</option><option value="lc">Left calf</option><option value="rc">Right calf</option><option value="la">Left arm</option><option value="ra">Right arm</option></select><button data-axis="x" class="active">X</button><button data-axis="y">Y</button><button data-axis="z">Z</button><button id="minus">−20°</button><button id="plus">+20°</button><button id="reset">Reset</button></div><div id="reportbox"><button id="reporttoggle" type="button">Show diagnostics</button><button id="copyreport" type="button">Copy diagnostics</button><pre id="report">Loading skeleton...</pre></div><div id="tip">Animation test only · Drag to rotate · Pinch to zoom</div><div id="ui"><button data-mode="idle" class="active">Idle</button><button data-mode="walk">Walk</button><button data-mode="run">Run</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script><script>addEventListener('error',e=>document.querySelector('#status').textContent='Error: '+e.message);addEventListener('unhandledrejection',e=>document.querySelector('#status').textContent='Error: '+e.reason)</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
document.querySelector('#reporttoggle').onclick=()=>document.querySelector('#report').classList.toggle('open');document.querySelector('#copyreport').onclick=async()=>{updateReport();const t=document.querySelector('#report').textContent;try{await navigator.clipboard.writeText(t);document.querySelector('#copyreport').textContent='Copied!'}catch(e){document.querySelector('#report').classList.add('open');document.querySelector('#copyreport').textContent='Long-press report to copy'}};const status=document.querySelector('#status');const scene=new THREE.Scene();scene.background=new THREE.Color('#0b1424');const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd8edff,0x283348,2.3));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(3,6,4);scene.add(sun);const grid=new THREE.GridHelper(8,16,0x2e6ba5,0x23405e);scene.add(grid);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;
let mode='idle',bones={},clock=new THREE.Clock(),time=0,model=null,axis='x',angle=0,reportBase='Loading…';const joint=document.querySelector('#joint');const axes={x:new THREE.Vector3(1,0,0),y:new THREE.Vector3(0,1,0),z:new THREE.Vector3(0,0,1)};const updateReport=()=>{const k=joint.value;const b=bones[k];const world=b?b.obj.getWorldQuaternion(new THREE.Quaternion()):null;document.querySelector('#report').textContent=reportBase+'\n\nCALIBRATION\nMode: '+mode+'\nJoint: '+k+'\nBone: '+(b?.obj.name||'not found')+'\nAxis: '+axis+'\nAngle: '+angle+' degrees\nRest quaternion: '+(b?b.rest.toArray().map(v=>v.toFixed(5)).join(', '):'none')+'\nWorld quaternion: '+(world?world.toArray().map(v=>v.toFixed(5)).join(', '):'none')+'\nObservation: [tell ChatGPT which direction limb moves]';};document.querySelectorAll('[data-axis]').forEach(b=>b.onclick=()=>{axis=b.dataset.axis;document.querySelectorAll('[data-axis]').forEach(x=>x.classList.toggle('active',x===b));updateReport();});joint.onchange=()=>{angle=0;updateReport()};document.querySelector('#minus').onclick=()=>{mode='calibrate';angle=Math.max(-100,angle-20);updateReport()};document.querySelector('#plus').onclick=()=>{mode='calibrate';angle=Math.min(100,angle+20);updateReport()};document.querySelector('#reset').onclick=()=>{angle=0;mode='idle';updateReport()};document.querySelectorAll('#ui button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('#ui button').forEach(x=>x.classList.toggle('active',x===b));updateReport();});
const names={lt:'Bip01 L Thigh',rt:'Bip01 R Thigh',lc:'Bip01 L Calf',rc:'Bip01 R Calf',la:'Bip01 L UpperArm',ra:'Bip01 R UpperArm',lf:'Bip01 L Foot',rf:'Bip01 R Foot',sp:'Bip01 Spine'};
new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('./Military_Male_02-custom.glb',g=>{model=g.scene;scene.add(model);model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());model.position.sub(center);model.position.y+=size.y/2;const largest=Math.max(size.x,size.y,size.z);camera.position.set(largest*1.15,largest*.8,largest*2.2);controls.target.set(0,size.y*.5,0);camera.near=Math.max(.001,largest/1000);camera.far=Math.max(100,largest*100);camera.updateProjectionMatrix();controls.update();const nodes=[],boneNodes=[],skinBones=[];model.traverse(o=>{nodes.push(o);if(o.isBone)boneNodes.push(o);if(o.isSkinnedMesh)skinBones.push(...o.skeleton.bones);});const unique=[...new Set([...boneNodes,...skinBones])];const normalize=n=>String(n||'').toLowerCase().replace(/[^a-z0-9]/g,'');for(const [key,name] of Object.entries(names)){const candidates=[...unique,...nodes];const found=candidates.find(o=>normalize(o.name)===normalize(name));if(found&&found.isBone)bones[key]={obj:found,rest:found.quaternion.clone()};}const found=Object.keys(bones).join(', ')||'none';const missing=Object.entries(names).filter(([k])=>!bones[k]).map(([,v])=>v);status.textContent='Bones found: '+found+' · '+unique.length+' skeleton joints';const report=document.querySelector('#report');reportBase='THREE.JS SKELETON REPORT\nScene nodes: '+nodes.length+'\nBone objects: '+boneNodes.length+'\nSkinned mesh joints: '+skinBones.length+'\nMatched: '+found+'\nMissing: '+(missing.join(', ')||'none')+'\n\nSkeleton bone names:\n'+(unique.map(o=>o.name||'(unnamed)').join('\n')||'No bone objects detected')+'\n\nAll named nodes:\n'+nodes.map(o=>o.name||'(unnamed)').join('\n');updateReport();},undefined,e=>status.textContent='Model failed: '+(e.message||e));
const temp=new THREE.Quaternion();function pose(k,x,z=0){const b=bones[k];if(!b)return;b.obj.quaternion.copy(b.rest).multiply(temp.setFromAxisAngle(axes[axis],x));}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);time+=dt;const moving=mode==='walk'||mode==='run';const speed=mode==='run'?10:5.5;const amp=mode==='run'?.72:.43;const s=Math.sin(time*speed),other=-s;const ease=moving?1:0;pose('lt',s*amp*ease);pose('rt',other*amp*ease);pose('lc',Math.max(0,-s)*amp*.9*ease);pose('rc',Math.max(0,s)*amp*.9*ease);pose('la',-s*amp*.7*ease);pose('ra',s*amp*.7*ease);pose('lf',-s*amp*.18*ease);pose('rf',s*amp*.18*ease);pose('sp',moving?Math.sin(time*speed*2)*.035:0);if(mode==='calibrate'){pose(joint.value,THREE.MathUtils.degToRad(angle));}controls.update();renderer.render(scene,camera)});
</script></body></html>
