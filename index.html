<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cyber Hunter v0.08.6 Knee Bend Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1424;color:#e9f3ff;font-family:system-ui}canvas{display:block;touch-action:none}#top{position:absolute;top:env(safe-area-inset-top,12px);left:12px;right:12px;pointer-events:none}h3{margin:8px 0 4px;color:#78baff}#status{font-size:13px}#ui{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:10px;right:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{background:#1a3554;color:white;border:1px solid #5686b8;border-radius:14px;padding:12px 17px;font-size:16px;font-weight:650}button.active{background:#2676ba}#reportbox{position:absolute;top:82px;left:12px;right:12px;z-index:2}#reportbox button{padding:8px;font-size:12px}#report{display:none;max-height:38vh;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#142640;border:1px solid #5686b8;border-radius:8px;padding:10px;font-size:11px}#report.open{display:block}#calibrate{position:absolute;top:72px;left:12px;right:12px;z-index:3;display:flex;gap:5px;align-items:center;flex-wrap:wrap}#calibrate select,#calibrate button{font-size:12px;padding:7px;border-radius:8px;background:#1a3554;color:white;border:1px solid #5686b8}#calibrate button.active{background:#2676ba}#tip{position:absolute;bottom:105px;left:8px;right:8px;text-align:center;color:#9bb7d5;font-size:12px;pointer-events:none}</style></head><body><div id="top"><h3>Cyber Hunter · Knee Bend Test v0.08.6</h3><div id="status">Loading soldier…</div></div><div id="calibrate" style="display:none"><select id="joint"><option value="lt">Left thigh</option><option value="rt">Right thigh</option><option value="lc">Left calf</option><option value="rc">Right calf</option><option value="la">Left arm</option><option value="ra">Right arm</option></select><button data-axis="x" class="active">X</button><button data-axis="y">Y</button><button data-axis="z">Z</button><button id="minus">−20°</button><button id="plus">+20°</button><button id="reset">Reset</button></div><div id="reportbox"><button id="kneesign" type="button">Knee bend: +Z</button><button id="autotest" type="button">Run automatic tests</button><button id="reporttoggle" type="button">Show results</button><button id="copyreport" type="button">Copy results</button><pre id="report">Loading skeleton...</pre></div><div id="tip">Knee-bend experiment · Drag to rotate · Pinch to zoom</div><div id="ui"><button data-mode="idle" class="active">Idle</button><button data-mode="walk">Walk</button><button data-mode="run">Run</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script><script>addEventListener('error',e=>document.querySelector('#status').textContent='Error: '+e.message);addEventListener('unhandledrejection',e=>document.querySelector('#status').textContent='Error: '+e.reason)</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
document.querySelector('#reporttoggle').onclick=()=>document.querySelector('#report').classList.toggle('open');document.querySelector('#copyreport').onclick=async()=>{updateReport();const t=document.querySelector('#report').textContent;try{await navigator.clipboard.writeText(t);document.querySelector('#copyreport').textContent='Copied! Paste into ChatGPT'}catch(e){document.querySelector('#report').classList.add('open');document.querySelector('#copyreport').textContent='Long-press report to copy'}};const status=document.querySelector('#status');const scene=new THREE.Scene();scene.background=new THREE.Color('#0b1424');const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd8edff,0x283348,2.3));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(3,6,4);scene.add(sun);const grid=new THREE.GridHelper(8,16,0x2e6ba5,0x23405e);scene.add(grid);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;
let kneeSign=1;let autoResults='Not run yet',mode='idle',bones={},clock=new THREE.Clock(),time=0,model=null,axis='x',angle=0,reportBase='Loading…';const joint=document.querySelector('#joint');const axes={x:new THREE.Vector3(1,0,0),y:new THREE.Vector3(0,1,0),z:new THREE.Vector3(0,0,1)};const updateReport=()=>{const k=joint.value;const b=bones[k];const world=b?b.obj.getWorldQuaternion(new THREE.Quaternion()):null;document.querySelector('#report').textContent=reportBase+'\n\nAUTOMATIC TEST RESULTS\n'+autoResults+'\n\nWALK TEST CONFIGURATION\nThighs/calves/feet: local Z; arms: local Z; spine: local X\nKnee bend direction: '+(kneeSign>0?'+Z':'-Z')+'\nMode: '+mode+'\nJoint: '+k+'\nBone: '+(b?.obj.name||'not found')+'\nAxis: '+axis+'\nAngle: '+angle+' degrees\nRest quaternion: '+(b?b.rest.toArray().map(v=>v.toFixed(5)).join(', '):'none')+'\nWorld quaternion: '+(world?world.toArray().map(v=>v.toFixed(5)).join(', '):'none')+'\nObservation: [tell ChatGPT which direction limb moves]';};document.querySelectorAll('[data-axis]').forEach(b=>b.onclick=()=>{axis=b.dataset.axis;document.querySelectorAll('[data-axis]').forEach(x=>x.classList.toggle('active',x===b));updateReport();});joint.onchange=()=>{angle=0;updateReport()};document.querySelector('#minus').onclick=()=>{mode='calibrate';angle=Math.max(-100,angle-20);updateReport()};document.querySelector('#plus').onclick=()=>{mode='calibrate';angle=Math.min(100,angle+20);updateReport()};document.querySelector('#reset').onclick=()=>{angle=0;mode='idle';updateReport()};document.querySelectorAll('#ui button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('#ui button').forEach(x=>x.classList.toggle('active',x===b));updateReport();});
const names={lt:'Bip01 L Thigh',rt:'Bip01 R Thigh',lc:'Bip01 L Calf',rc:'Bip01 R Calf',la:'Bip01 L UpperArm',ra:'Bip01 R UpperArm',lf:'Bip01 L Foot',rf:'Bip01 R Foot',sp:'Bip01 Spine'};
new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('./Military_Male_02-custom.glb',g=>{model=g.scene;scene.add(model);model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());model.position.sub(center);model.position.y+=size.y/2;const largest=Math.max(size.x,size.y,size.z);camera.position.set(largest*1.15,largest*.8,largest*2.2);controls.target.set(0,size.y*.5,0);camera.near=Math.max(.001,largest/1000);camera.far=Math.max(100,largest*100);camera.updateProjectionMatrix();controls.update();const nodes=[],boneNodes=[],skinBones=[];model.traverse(o=>{nodes.push(o);if(o.isBone)boneNodes.push(o);if(o.isSkinnedMesh)skinBones.push(...o.skeleton.bones);});const unique=[...new Set([...boneNodes,...skinBones])];const normalize=n=>String(n||'').toLowerCase().replace(/[^a-z0-9]/g,'');for(const [key,name] of Object.entries(names)){const candidates=[...unique,...nodes];const found=candidates.find(o=>normalize(o.name)===normalize(name));if(found&&found.isBone)bones[key]={obj:found,rest:found.quaternion.clone()};}const found=Object.keys(bones).join(', ')||'none';const missing=Object.entries(names).filter(([k])=>!bones[k]).map(([,v])=>v);status.textContent='Bones found: '+found+' · '+unique.length+' skeleton joints';const report=document.querySelector('#report');reportBase='THREE.JS SKELETON REPORT\nScene nodes: '+nodes.length+'\nBone objects: '+boneNodes.length+'\nSkinned mesh joints: '+skinBones.length+'\nMatched: '+found+'\nMissing: '+(missing.join(', ')||'none')+'\n\nSkeleton bone names:\n'+(unique.map(o=>o.name||'(unnamed)').join('\n')||'No bone objects detected')+'\n\nAll named nodes:\n'+nodes.map(o=>o.name||'(unnamed)').join('\n');updateReport();runAutomaticTests();},undefined,e=>status.textContent='Model failed: '+(e.message||e));
const temp=new THREE.Quaternion();
const movementAxes={lt:'z',rt:'z',lc:'z',rc:'z',la:'z',ra:'z',lf:'z',rf:'z',sp:'x'};
function pose(k,angleRad){const b=bones[k];if(!b)return;
 b.obj.quaternion.copy(b.rest).multiply(temp.setFromAxisAngle(axes[movementAxes[k]],angleRad));}

const kneeButton=document.querySelector('#kneesign');kneeButton.onclick=()=>{kneeSign*=-1;kneeButton.textContent='Knee bend: '+(kneeSign>0?'+Z':'−Z');updateReport();};const autoButton=document.querySelector('#autotest');
const testKeys=['lt','rt','lc','rc','la','ra','lf','rf','sp'];
function measureJoint(key,axisName,degrees){
 const b=bones[key];if(!b)return null;
 const o=b.obj, q=o.quaternion.clone();
 // Choose furthest descendant bone, using the original hierarchy, to measure limb endpoint movement.
 let end=o,depth=-1;o.traverse(child=>{if(child!==o&&child.isBone){let d=0,x=child;while(x&&x!==o){d++;x=x.parent;}if(d>depth){depth=d;end=child;}}});
 if(end===o)return {error:'no descendant bone'};
 o.quaternion.copy(b.rest);model.updateMatrixWorld(true);
 const origin=o.getWorldPosition(new THREE.Vector3()),before=end.getWorldPosition(new THREE.Vector3());
 o.quaternion.copy(b.rest).multiply(new THREE.Quaternion().setFromAxisAngle(axes[axisName],THREE.MathUtils.degToRad(degrees)));
 model.updateMatrixWorld(true);
 const after=end.getWorldPosition(new THREE.Vector3());
 o.quaternion.copy(q);model.updateMatrixWorld(true);
 const delta=after.sub(before);
 return {endpoint:end.name,lever:origin.distanceTo(before),dx:delta.x,dy:delta.y,dz:delta.z,dist:delta.length()};
}
function runAutomaticTests(){
 if(!model){autoResults='ERROR: Model not loaded yet';updateReport();return;}
 mode='idle';angle=0;
 const lines=['Cyber Hunter v0.08.6 - automatic joint calibration','Measured displacement of descendant bone endpoint after +20 and -20 degree LOCAL axis rotations.','Coordinate values are Three.js WORLD X/Y/Z; these are measurements, not guaranteed anatomical directions.'];
 const saved={};for(const [k,b] of Object.entries(bones))saved[k]=b.obj.quaternion.clone();
 try{
 for(const k of testKeys){
  const b=bones[k];lines.push('\nJOINT '+k+' / '+(b?.obj.name||'MISSING'));
  if(!b)continue;
  for(const a of ['x','y','z']){
   for(const deg of [20,-20]){
    const r=measureJoint(k,a,deg);
    if(!r||r.error){lines.push(a+' '+deg+': '+(r?.error||'unavailable'));continue;}
    const fmt=n=>n.toFixed(5);
    lines.push(a.toUpperCase()+' '+deg+'deg -> endpoint '+r.endpoint+'; world displacement X='+fmt(r.dx)+' Y='+fmt(r.dy)+' Z='+fmt(r.dz)+'; magnitude='+fmt(r.dist)+'; lever='+fmt(r.lever));
   }
  }
 }
 }catch(e){lines.push('TEST ERROR: '+e.message)}finally{for(const [k,q] of Object.entries(saved))bones[k].obj.quaternion.copy(q);model.updateMatrixWorld(true);}
 autoResults=lines.join('\n');updateReport();document.querySelector('#report').classList.add('open');autoButton.textContent='Run tests again';status.textContent='Walking test ready · '+Object.keys(bones).length+' joints found';
}
autoButton.onclick=runAutomaticTests;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);time+=dt;const moving=mode==='walk'||mode==='run';const speed=mode==='run'?10:5.5;const amp=mode==='run'?.72:.43;const s=Math.sin(time*speed),other=-s;const ease=moving?1:0;
pose('lt',s*amp*ease);pose('rt',other*amp*ease);
const leftSwing=Math.max(0,-s),rightSwing=Math.max(0,s);
pose('lc',kneeSign*leftSwing*(mode==='run'?.95:.72)*ease);pose('rc',kneeSign*rightSwing*(mode==='run'?.95:.72)*ease);
pose('la',-s*amp*.45*ease);pose('ra',s*amp*.45*ease);
pose('lf',-s*amp*.12*ease);pose('rf',s*amp*.12*ease);
pose('sp',moving?Math.sin(time*speed*2)*.02:0);
if(mode==='calibrate'){const b=bones[joint.value];if(b)b.obj.quaternion.copy(b.rest).multiply(temp.setFromAxisAngle(axes[axis],THREE.MathUtils.degToRad(angle)));}controls.update();renderer.render(scene,camera)});
</script></body></html>
