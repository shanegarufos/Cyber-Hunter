<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cyber Hunter v0.08 Movement Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1424;color:#e9f3ff;font-family:system-ui}canvas{display:block;touch-action:none}#top{position:absolute;top:env(safe-area-inset-top,12px);left:12px;right:12px;pointer-events:none}h3{margin:8px 0 4px;color:#78baff}#status{font-size:13px}#ui{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:10px;right:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{background:#1a3554;color:white;border:1px solid #5686b8;border-radius:14px;padding:12px 17px;font-size:16px;font-weight:650}button.active{background:#2676ba}#tip{position:absolute;bottom:105px;left:8px;right:8px;text-align:center;color:#9bb7d5;font-size:12px;pointer-events:none}</style></head><body><div id="top"><h3>Cyber Hunter · Movement v0.08</h3><div id="status">Loading soldier…</div></div><div id="tip">Animation test only · Drag to rotate · Pinch to zoom</div><div id="ui"><button data-mode="idle" class="active">Idle</button><button data-mode="walk">Walk</button><button data-mode="run">Run</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script><script>addEventListener('error',e=>document.querySelector('#status').textContent='Error: '+e.message);addEventListener('unhandledrejection',e=>document.querySelector('#status').textContent='Error: '+e.reason)</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const status=document.querySelector('#status');const scene=new THREE.Scene();scene.background=new THREE.Color('#0b1424');const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd8edff,0x283348,2.3));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(3,6,4);scene.add(sun);const grid=new THREE.GridHelper(8,16,0x2e6ba5,0x23405e);scene.add(grid);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;
let mode='idle',bones={},clock=new THREE.Clock(),time=0,model=null;document.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));});
const names={lt:'Bip01 L Thigh',rt:'Bip01 R Thigh',lc:'Bip01 L Calf',rc:'Bip01 R Calf',la:'Bip01 L UpperArm',ra:'Bip01 R UpperArm',lf:'Bip01 L Foot',rf:'Bip01 R Foot',sp:'Bip01 Spine'};
new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('./Military_Male_02-custom.glb',g=>{model=g.scene;scene.add(model);model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());model.position.sub(center);model.position.y+=size.y/2;const largest=Math.max(size.x,size.y,size.z);camera.position.set(largest*1.15,largest*.8,largest*2.2);controls.target.set(0,size.y*.5,0);camera.near=Math.max(.001,largest/1000);camera.far=Math.max(100,largest*100);camera.updateProjectionMatrix();controls.update();model.traverse(o=>{if(o.isBone){for(const [key,name] of Object.entries(names))if(o.name===name)bones[key]={obj:o,rest:o.quaternion.clone()};}});status.textContent='Soldier loaded ✓ · Choose Walk or Run';if(!bones.lt||!bones.rt)status.textContent='Soldier loaded; leg bones not found';},undefined,e=>status.textContent='Model failed: '+(e.message||e));
const axisX=new THREE.Vector3(1,0,0),axisZ=new THREE.Vector3(0,0,1),temp=new THREE.Quaternion();function pose(k,x,z=0){const b=bones[k];if(!b)return;b.obj.quaternion.copy(b.rest).multiply(temp.setFromAxisAngle(axisX,x));if(z)b.obj.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(axisZ,z));}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);time+=dt;const moving=mode!=='idle';const speed=mode==='run'?10:5.5;const amp=mode==='run'?.72:.43;const s=Math.sin(time*speed),other=-s;const ease=moving?1:0;pose('lt',s*amp*ease);pose('rt',other*amp*ease);pose('lc',Math.max(0,-s)*amp*.9*ease);pose('rc',Math.max(0,s)*amp*.9*ease);pose('la',-s*amp*.7*ease);pose('ra',s*amp*.7*ease);pose('lf',-s*amp*.18*ease);pose('rf',s*amp*.18*ease);pose('sp',moving?Math.sin(time*speed*2)*.035:Math.sin(time*1.5)*.012);controls.update();renderer.render(scene,camera)});
</script></body></html>
